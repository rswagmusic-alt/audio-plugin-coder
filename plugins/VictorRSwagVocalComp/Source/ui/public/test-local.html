<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor R Swag Vocal Compressor</title>

  Control IDs map 1:1 to APVTS parameter IDs:
    amount, character, mix, output, sc_hpf (sliders), bypass (toggle)
  Gain reduction arrives from C++ as a "grUpdate" event: { opto, fet } in dB.

  webview-008 compliance:
    - ALL JavaScript inline in ONE <script> block
    - no type="module", no import/export, no <script src>
    - no external CSS, fonts or images
    - boots on document.readyState, not DOMContentLoaded alone
    - sets window.__pluginBooted so C++ can detect a dead UI
-->
<style>
  :root {
    --bg:         #0B0D10;
    --panel:      #12161B;
    --line:       #232A32;
    --text:       #E6EDF3;
    --muted:      #7D8894;
    --accent:     #00F5FF;
    --accent-dim: #0A7F88;
    --warn:       #FF4D6D;
    --pad: 24px;
  }

  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    width: 640px;
    height: 420px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #plugin-ui {
    width: 640px;
    height: 420px;
    padding: var(--pad);
    padding-bottom: 8px;
    display: flex;
    flex-direction: column;
    transition: opacity 120ms ease-out;
  }
  #plugin-ui.bypassed { opacity: 0.45; }

  /* ---------- header ---------- */
  .header {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .wordmark {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 120ms ease-out;
  }
  .wordmark:hover { color: var(--text); }

  #preset-select {
    width: 180px;
    height: 28px;
    background-color: var(--panel);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%2300F5FF' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 0 26px 0 10px;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    cursor: pointer;
    transition: border-color 120ms ease-out;
  }
  #preset-select:hover { border-color: var(--accent-dim); }

  /* ---------- hero ---------- */
  .hero {
    height: 196px;
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex: 0 0 auto;
  }

  .control { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .value {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .zone {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--accent-dim);
    height: 11px;
  }

  /* ---------- knobs ---------- */
  .knob {
    position: relative;
    cursor: ns-resize;
    outline: none;
    touch-action: none;
  }
  .knob svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .knob .k-body { fill: var(--panel); }
  .knob .k-track {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    transition: stroke 120ms ease-out;
  }
  .knob:hover .k-track { stroke: #2C343D; }
  .knob .k-arc {
    fill: none;
    stroke: var(--accent);
    stroke-linecap: round;
    opacity: 0.85;
    transition: opacity 120ms ease-out;
  }
  .knob:hover .k-arc, .knob.dragging .k-arc { opacity: 1; }
  .knob .k-notch { stroke: var(--muted); stroke-width: 1; opacity: 0.6; }
  .knob .k-ind {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    background: var(--text);
    border-radius: 1px;
    transform-origin: 50% 100%;
    opacity: 0.75;
    transition: opacity 120ms ease-out;
  }
  .knob:hover .k-ind, .knob.dragging .k-ind { opacity: 1; }
  .knob:focus-visible::after {
    content: "";
    position: absolute;
    inset: -4px;
    border: 1px solid var(--accent);
    opacity: 0.4;
    border-radius: 50%;
  }

  .knob.hero   { width: 150px; height: 150px; }
  .knob.second { width: 90px;  height: 90px;  }
  .knob.mini   { width: 56px;  height: 56px;  }

  .knob.hero .k-ind   { height: 26px; margin-top: -75px; margin-left: -1px; }
  .knob.second .k-ind { height: 16px; margin-top: -45px; margin-left: -1px; }
  .knob.mini .k-ind   { height: 10px; margin-top: -28px; margin-left: -1px; }

  /* the Amount knob is the only glowing element */
  .knob.hero .k-arc {
    filter: drop-shadow(0 0 6px rgba(0, 245, 255, calc(0.25 + var(--v, 0) * 0.45)));
  }

  /* ---------- meter ---------- */
  .meter-row {
    height: 44px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }
  .meter-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--muted);
    width: 20px;
  }
  #gr-canvas {
    flex: 1 1 auto;
    height: 44px;
    display: block;
    border-radius: 4px;
    cursor: crosshair;
  }
  #gr-readout {
    width: 62px;
    text-align: right;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- utility ---------- */
  .utility {
    height: 60px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 28px;
    flex: 0 0 auto;
  }
  .utility .control { gap: 4px; }
  .utility .label { font-size: 9px; }
  .utility .value { font-size: 11px; }
  .spacer { flex: 1 1 auto; }

  #bypass-btn {
    width: 96px;
    height: 32px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
    transition: all 120ms ease-out;
  }
  #bypass-btn:hover { border-color: var(--accent-dim); color: var(--text); }
  #bypass-btn.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #06181B;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0ms !important; }
    .knob.hero .k-arc { filter: none; }
  }
</style>
</head>
<body>

<div id="plugin-ui">

  <div class="header">
    <div class="wordmark">VRS Vocal Comp</div>
    <select id="preset-select" title="Factory presets">
      <option value="init">Init</option>
      <option value="intimate">Intimate Vocal</option>
      <option value="pop" selected>Pop Lead</option>
      <option value="rap">Rap Upfront</option>
      <option value="crush">Parallel Crush</option>
      <option value="broadcast">Broadcast Even</option>
    </select>
  </div>

  <div class="hero">
    <div class="control">
      <div class="label">Character</div>
      <div class="knob second" id="character-knob" tabindex="0" role="slider"
           data-param="character" data-min="0" data-max="100" data-default="50"
           data-unit="%" data-stroke="5">
        <svg viewBox="0 0 100 100">
          <circle class="k-body" cx="50" cy="50" r="34"></circle>
          <circle class="k-track" cx="50" cy="50" r="42"></circle>
          <circle class="k-arc"   cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="k-ind"></div>
      </div>
      <div class="value" id="character-value">50%</div>
      <div class="zone" id="character-zone">Balanced</div>
    </div>

    <div class="control">
      <div class="label">Amount</div>
      <div class="knob hero" id="amount-knob" tabindex="0" role="slider"
           data-param="amount" data-min="0" data-max="100" data-default="35"
           data-unit="%" data-stroke="7">
        <svg viewBox="0 0 100 100">
          <circle class="k-body" cx="50" cy="50" r="33"></circle>
          <circle class="k-track" cx="50" cy="50" r="42"></circle>
          <circle class="k-arc"   cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="k-ind"></div>
      </div>
      <div class="value" id="amount-value">35%</div>
      <div class="zone"></div>
    </div>

    <div class="control">
      <div class="label">Mix</div>
      <div class="knob second" id="mix-knob" tabindex="0" role="slider"
           data-param="mix" data-min="0" data-max="100" data-default="100"
           data-unit="%" data-stroke="5">
        <svg viewBox="0 0 100 100">
          <circle class="k-body" cx="50" cy="50" r="34"></circle>
          <circle class="k-track" cx="50" cy="50" r="42"></circle>
          <circle class="k-arc"   cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="k-ind"></div>
      </div>
      <div class="value" id="mix-value">100%</div>
      <div class="zone"></div>
    </div>
  </div>

  <div class="meter-row">
    <div class="meter-tag">GR</div>
    <canvas id="gr-canvas" title="Gain reduction - hover to split by stage"></canvas>
    <div id="gr-readout">-0.0 dB</div>
  </div>

  <div class="utility">
    <div class="control">
      <div class="label">SC HPF</div>
      <div class="knob mini" id="sc_hpf-knob" tabindex="0" role="slider"
           data-param="sc_hpf" data-min="20" data-max="300" data-default="85"
           data-unit="Hz" data-taper="log" data-stroke="4">
        <svg viewBox="0 0 100 100">
          <circle class="k-body" cx="50" cy="50" r="33"></circle>
          <circle class="k-track" cx="50" cy="50" r="42"></circle>
          <circle class="k-arc"   cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="k-ind"></div>
      </div>
      <div class="value" id="sc_hpf-value">85 Hz</div>
    </div>

    <div class="control">
      <div class="label">Output</div>
      <div class="knob mini" id="output-knob" tabindex="0" role="slider"
           data-param="output" data-min="-12" data-max="12" data-default="0"
           data-unit="dB" data-bipolar="1" data-stroke="4">
        <svg viewBox="0 0 100 100">
          <circle class="k-body" cx="50" cy="50" r="33"></circle>
          <circle class="k-track" cx="50" cy="50" r="42"></circle>
          <circle class="k-arc"   cx="50" cy="50" r="42"></circle>
          <line class="k-notch" x1="50" y1="4" x2="50" y2="11"></line>
        </svg>
        <div class="k-ind"></div>
      </div>
      <div class="value" id="output-value">+0.0 dB</div>
    </div>

    <div class="spacer"></div>

    <button id="bypass-btn" type="button">Bypass</button>
  </div>

</div>

      console.log("VRS Vocal Comp - no native backend, UI running standalone");
    }
  }

  /* readyState guard: DOMContentLoaded may already have fired (webview-008) */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

/* ============================================================
   BROWSER TEST HARNESS - test-local.html ONLY
   This block is the ONLY difference from index.html. It fakes a
   vocal envelope so the meter and knobs can be evaluated in a
   browser. The plugin never loads this file.
   ============================================================ */
(function () {
  if (typeof window.__JUCE__ !== "undefined" && window.__JUCE__.backend &&
      window.__JUCE__.initialisationData &&
      window.__JUCE__.initialisationData.__juce__sliders.length > 0) {
    return;   /* real backend attached - do not simulate */
  }
  var t = 0, last = 0;
  function tick(now) {
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0.016;
    last = now;
    t += dt;

    var amountEl = document.getElementById("amount-knob");
    var charEl = document.getElementById("character-knob");
    var amountN = amountEl ? parseFloat(amountEl.style.getPropertyValue("--v") || 0.35) : 0.35;
    var charN = charEl ? parseFloat(charEl.style.getPropertyValue("--v") || 0.5) : 0.5;

    /* pseudo vocal envelope: slow phrase + syllable rate + transient spikes */
    var phrase   = 0.5 + 0.5 * Math.sin(t * 0.7);
    var syllable = 0.5 + 0.5 * Math.sin(t * 5.3 + 1.1);
    var env      = 0.35 + 0.65 * (0.6 * phrase + 0.4 * syllable);
    var spike    = Math.pow(Math.max(0, Math.sin(t * 3.1 + 0.4)), 12);

    var bypassed = document.getElementById("plugin-ui").classList.contains("bypassed");
    var opto = bypassed ? 0 : amountN * (1 - charN * 0.6) * 13 * env;
    var fet  = bypassed ? 0 : amountN * (0.2 + charN * 0.85) * 11 * (0.25 * env + 0.9 * spike);

    if (window.__vrsSetGR) window.__vrsSetGR(opto, fet);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  console.log("VRS Vocal Comp - browser test harness active (simulated gain reduction)");
})();
/* ===================== END BROWSER TEST HARNESS ===================== */
</script>
